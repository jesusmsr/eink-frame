; Firmware del marco E-Ink (LOLIN D32 Pro + Waveshare 7.3" ACeP HAT (F))
;
;   pio run -e release -t upload        → flashear
;   pio run -e debug -t upload -t monitor   → flashear con logs por serie
;
; Antes: copia include/config.example.h a include/config.h y rellénalo.

[env]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17
board = lolin_d32_pro
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    zinggjm/GxEPD2@1.6.9
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DFW_VERSION=\"2.0.0\"

[env:release]
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DDISABLE_DIAGNOSTIC_OUTPUT

[env:debug]
build_type = debug
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DEINK_DEBUG=1

; Prueba de consumo en reposo (fase 0): no conecta a nada, solo duerme.
[env:sleeptest]
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DEINK_DEBUG=1
    -DSLEEP_TEST=1
